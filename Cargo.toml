[package]
name = "gitlab"
version = "0.1.2"
edition = "2024"

[lib]
name = "plugin"
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4"
git-version = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64-serde = "0.7"
base64 = "0.21"
urlencoding = "2.1"
url = "2.5"
termtree = "0.5.1"

[package.metadata.release]
publish = false
push = true
tag = true
tag-name = "v{{version}}"
